apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-care-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pet-care-service
  template:
    metadata:
      labels:
        app: pet-care-service
      annotations:
        app-version: "v2"
    spec:
      containers:
        - name: pet-care-service
          image: pet-care-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pet-care-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 75
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"